name: Anbo downstream CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  policy:
    name: downstream policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Check downstream release policy
        run: python scripts/check_downstream_policy.py

      - name: Check Docker child ownership policy
        run: python scripts/check_docker_ownership.py

  tests:
    name: downstream tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install downstream test dependencies
        run: python -m pip install -e ".[full]" pytest

      - name: Run downstream tests
        run: python -m pytest -o addopts='' tests_anbo -q
