name: Anbo image release

on:
  push:
    tags:
      - "v*.*.*-anbo.*"

concurrency:
  group: anbo-image-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/getanbo/anbo-ministack

jobs:
  release:
    name: promote tested image digests
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Validate release tag and source commit
        id: release
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python scripts/anbo_distribution.py validate-version "${version}"
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Release tags must point to a commit already contained in main" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve and verify release candidates
        id: candidates
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          regular_ref="${IMAGE}:rc-${VERSION}"
          full_ref="${IMAGE}:rc-${VERSION}-full"
          regular_digest=$(docker buildx imagetools inspect "${regular_ref}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          full_digest=$(docker buildx imagetools inspect "${full_ref}" --format '{{json .Manifest.Digest}}' | tr -d '"')

          for digest in "${regular_digest}" "${full_digest}"; do
            if ! printf '%s' "${digest}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
              echo "Candidate did not resolve to an immutable sha256 digest" >&2
              exit 1
            fi
          done

          docker buildx imagetools inspect "${regular_ref}" --format '{{json .Image}}' > regular-image.json
          docker buildx imagetools inspect "${full_ref}" --format '{{json .Image}}' > full-image.json
          VERSION="${VERSION}" SOURCE_SHA="${GITHUB_SHA}" python - <<'PY'
          import json
          import os

          for filename in ("regular-image.json", "full-image.json"):
              images = json.load(open(filename))
              if not images:
                  raise SystemExit(f"{filename} contains no platform manifests")
              for platform, image in images.items():
                  labels = image.get("config", {}).get("Labels", {}) or {}
                  if labels.get("org.opencontainers.image.version") != os.environ["VERSION"]:
                      raise SystemExit(f"{filename} {platform} has the wrong release version label")
                  if labels.get("org.opencontainers.image.revision") != os.environ["SOURCE_SHA"]:
                      raise SystemExit(f"{filename} {platform} was not built from the tagged source commit")
          PY

          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "Refusing to overwrite released image ${IMAGE}:${VERSION}" >&2
            exit 1
          fi
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}-full" >/dev/null 2>&1; then
            echo "Refusing to overwrite released image ${IMAGE}:${VERSION}-full" >&2
            exit 1
          fi

          echo "regular=${regular_digest}" >> "${GITHUB_OUTPUT}"
          echo "full=${full_digest}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify candidate signatures
        env:
          REGULAR_DIGEST: ${{ steps.candidates.outputs.regular }}
          FULL_DIGEST: ${{ steps.candidates.outputs.full }}
        run: |
          set -euo pipefail
          identity='^https://github.com/getanbo/anbo-ministack/.github/workflows/anbo-image-candidate.yml@refs/heads/main$'
          for digest in "${REGULAR_DIGEST}" "${FULL_DIGEST}"; do
            cosign verify \
              --certificate-identity-regexp "${identity}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "${IMAGE}@${digest}"
          done

      - name: Promote exact candidate indexes without rebuilding
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REGULAR_DIGEST: ${{ steps.candidates.outputs.regular }}
          FULL_DIGEST: ${{ steps.candidates.outputs.full }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            "${IMAGE}@${REGULAR_DIGEST}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}-full" \
            "${IMAGE}@${FULL_DIGEST}"
          actual_regular=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          actual_full=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}-full" --format '{{json .Manifest.Digest}}' | tr -d '"')
          [ "${actual_regular}" = "${REGULAR_DIGEST}" ]
          [ "${actual_full}" = "${FULL_DIGEST}" ]

      - name: Create regular image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.candidates.outputs.regular }}
          format: cyclonedx
          output: anbo-ministack-${{ steps.release.outputs.version }}.cdx.json

      - name: Create full image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.candidates.outputs.full }}
          format: cyclonedx
          output: anbo-ministack-${{ steps.release.outputs.version }}-full.cdx.json

      - name: Create release manifest
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REGULAR_DIGEST: ${{ steps.candidates.outputs.regular }}
          FULL_DIGEST: ${{ steps.candidates.outputs.full }}
        run: |
          python scripts/anbo_distribution.py manifest \
            --version "${VERSION}" \
            --source-sha "${GITHUB_SHA}" \
            --regular-digest "${REGULAR_DIGEST}" \
            --full-digest "${FULL_DIGEST}" \
            --output release-manifest.json
          sha256sum \
            release-manifest.json \
            "anbo-ministack-${VERSION}.cdx.json" \
            "anbo-ministack-${VERSION}-full.cdx.json" > SHA256SUMS

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          REGULAR_DIGEST: ${{ steps.candidates.outputs.regular }}
          FULL_DIGEST: ${{ steps.candidates.outputs.full }}
        run: |
          cat > release-notes.md <<EOF
          Anbo MiniStack ${VERSION}, based on the upstream release recorded in \`.github/upstream.json\`.

          Regular image: \`${IMAGE}@${REGULAR_DIGEST}\`

          Full image: \`${IMAGE}@${FULL_DIGEST}\`

          Use the immutable references in \`release-manifest.json\`. These indexes were promoted from the tested release candidates without rebuilding.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Anbo MiniStack ${VERSION}" \
            --notes-file release-notes.md \
            release-manifest.json \
            SHA256SUMS \
            "anbo-ministack-${VERSION}.cdx.json" \
            "anbo-ministack-${VERSION}-full.cdx.json"
