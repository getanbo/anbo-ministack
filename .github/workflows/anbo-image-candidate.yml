name: Anbo image candidate

on:
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile*"
      - ".dockerignore"
      - "ministack/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "scripts/anbo_distribution.py"
      - "scripts/check_downstream_policy.py"
      - ".github/upstream.json"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "Dockerfile*"
      - ".dockerignore"
      - "ministack/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "scripts/anbo_distribution.py"
      - "scripts/check_downstream_policy.py"
      - ".github/upstream.json"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Optional immutable release candidate version, for example 1.4.2-anbo.1"
        required: false
        type: string

concurrency:
  group: anbo-image-candidate-${{ github.ref }}-${{ inputs.release_version || github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/getanbo/anbo-ministack

jobs:
  build-pr:
    name: build ${{ matrix.variant }} image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: regular
            dockerfile: Dockerfile
          - variant: full
            dockerfile: Dockerfile.full
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check downstream policy
        run: python scripts/check_downstream_policy.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build without publishing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: MINISTACK_VERSION=pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          cache-from: type=gha,scope=anbo-${{ matrix.variant }}

  publish-candidate:
    name: publish ${{ matrix.variant }} candidate
    if: github.event_name != 'pull_request' && github.repository == 'getanbo/anbo-ministack'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: regular
            dockerfile: Dockerfile
            suffix: ""
          - variant: full
            dockerfile: Dockerfile.full
            suffix: "-full"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check downstream policy
        run: python scripts/check_downstream_policy.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Resolve immutable candidate identity
        id: candidate
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          VARIANT_SUFFIX: ${{ matrix.suffix }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          upstream_version=$(python -c 'import json; print(json.load(open(".github/upstream.json"))["ref"].removeprefix("v"))')
          if [ -n "${RELEASE_VERSION}" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
              echo "Release candidates must be built from the main branch" >&2
              exit 1
            fi
            version=$(python scripts/anbo_distribution.py validate-version "${RELEASE_VERSION}")
            base_tag="rc-${version}"
          else
            version="${upstream_version}-anbo.candidate.${short_sha}"
            base_tag="candidate-${GITHUB_SHA}"
          fi
          tag="${base_tag}${VARIANT_SUFFIX}"
          if docker buildx imagetools inspect "${IMAGE}:${tag}" >/dev/null 2>&1; then
            echo "Refusing to overwrite immutable candidate ${IMAGE}:${tag}" >&2
            exit 1
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Generate OCI metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          tags: type=raw,value=${{ steps.candidate.outputs.tag }}
          labels: |
            org.opencontainers.image.title=Anbo MiniStack
            org.opencontainers.image.description=Anbo distribution of the upstream MiniStack AWS emulator
            org.opencontainers.image.vendor=Anbo
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/getanbo/anbo-ministack
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.candidate.outputs.version }}

      - name: Build and push candidate once
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: MINISTACK_VERSION=${{ steps.candidate.outputs.version }}
          cache-from: type=gha,scope=anbo-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=anbo-${{ matrix.variant }}
          provenance: mode=max
          sbom: true

      - name: Scan candidate for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Create CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom-${{ matrix.variant }}.cdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign candidate digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Record candidate digest
        env:
          CANDIDATE_TAG: ${{ steps.candidate.outputs.tag }}
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          python - <<'PY'
          import json
          import os

          record = {
              "schemaVersion": 1,
              "variant": os.environ["VARIANT"],
              "version": os.environ["CANDIDATE_VERSION"],
              "sourceSha": os.environ["GITHUB_SHA"],
              "tag": f'{os.environ["IMAGE"]}:{os.environ["CANDIDATE_TAG"]}',
              "digest": os.environ["DIGEST"],
              "reference": f'{os.environ["IMAGE"]}@{os.environ["DIGEST"]}',
          }
          with open(f'candidate-{os.environ["VARIANT"]}.json', "w") as output:
              json.dump(record, output, indent=2, sort_keys=True)
              output.write("\n")
          PY

      - name: Upload candidate evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-${{ matrix.variant }}-${{ github.sha }}
          path: |
            candidate-${{ matrix.variant }}.json
            sbom-${{ matrix.variant }}.cdx.json
          if-no-files-found: error
          retention-days: 30

  candidate-result:
    name: candidate
    if: always()
    needs: [build-pr, publish-candidate]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check relevant image job
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_RESULT: ${{ needs.build-pr.result }}
          PUBLISH_RESULT: ${{ needs.publish-candidate.result }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            [ "${PR_RESULT}" = "success" ]
          else
            [ "${PUBLISH_RESULT}" = "success" ]
          fi
